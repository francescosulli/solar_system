[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solsys-emulator"
version = "0.1.0"
description = "ML ephemeris emulator for Solar System barycentric states."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "astropy>=5.3",
  "jplephem>=2.21",
  "torch>=2.1",
  "tqdm>=4.66",
  "matplotlib>=3.7",
  "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jupyter>=1.0",
  "ipykernel>=6.0",
  "ipywidgets>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
